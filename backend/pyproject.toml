[project]
name = "workflow-document-intelligence"
version = "0.1.0"
description = "Production-grade Workflow Automation & Document Intelligence Engine"
authors = [{ name = "Senior Backend Architect" }]
readme = "README.md"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long (handled by formatter)
    "B008", # do not perform function calls in argument defaults (FastAPI Depends)
    "UP046", # generic class syntax
]

[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests", "backend/tests"]
pythonpath = [".", "backend"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:pytest_asyncio.*",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]

[tool.coverage.run]
source = ["backend/app"]
omit = ["tests/*", "backend/tests/*", "backend/app/db/migrations/*"]

